worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;

    # --- Timeouts tuned for a dashboard UI ---
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    server {
        listen ${LISTEN_PORT};

        # --- Runtime DNS resolution (critical for Railway private networking) ---
        resolver ${RESOLVER} ipv6=on valid=30s;
        set $upstream http://${UPSTREAM_HOST}:${UPSTREAM_PORT};

        # --- Basic auth ---
        auth_basic "Prefect UI";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # --- Health check endpoint (no auth, Railway uses this) ---
        location = /health {
            auth_basic off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # --- Proxy to Prefect ---
        location / {
            proxy_pass $upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- WebSocket support (Prefect UI uses it for live updates) ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
